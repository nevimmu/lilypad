[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lilypad"
version = "0.0.0"
description = "Float and center a lone terminal in a Hyprland workspace; re-tile when a 2nd window appears"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lilypad = "lilypad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
version_files = ["src/lilypad/__init__.py:__version__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
